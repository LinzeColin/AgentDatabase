services:
  memory-atlas-web:
    image: nginx:1.28.3-alpine
    container_name: memory-atlas-web
    restart: unless-stopped
    volumes:
      - /srv/linze/apps/memory-atlas/current/dist:/usr/share/nginx/html:ro
      - /srv/linze/apps/agentdatabase/current/ops/memory-atlas/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # The atlas snapshot is regenerated by the reconcile every 15 minutes.
      # Baked into the release it could only change on a redeploy, which is
      # how the ten views stayed frozen on a 2026-07-16 build.
      - /srv/linze/apps/memory-atlas/shared/data/public:/usr/share/nginx/live:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.memory-atlas.rule=Host(`memoryatlas.linzezhang.com`)
      - traefik.http.routers.memory-atlas.entrypoints=https
      - traefik.http.routers.memory-atlas.tls=true
      - traefik.http.routers.memory-atlas.tls.certresolver=letsencrypt
      - traefik.http.services.memory-atlas.loadbalancer.server.port=8088

networks:
  coolify:
    external: true
