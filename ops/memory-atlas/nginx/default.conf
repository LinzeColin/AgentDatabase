server {
    listen 8088;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 '{"state":"PASS","component":"memory-atlas-web"}';
        add_header Content-Type application/json;
    }

    location /api/v31/ {
        proxy_pass http://host.docker.internal:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
    # Private snapshots are never served as static files. Every private read must
    # pass through /api/v31 and origin-side Access JWT verification.
    location ^~ /data/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
