schema_version: "skill_registry.v1"
skill_id: "dingtalk-incremental-media-archive"
source: "codex"
path: "CodexSkills/registry/codex/dingtalk-incremental-media-archive"
version: "0.2.0"
status: "candidate_for_acceptance"

layers:
  identity:
    consumer: "registry discovery"
    name: "DingTalk Incremental Media Archive / KMVideo 一体化流水线"
    description: "钉钉内部群图片与视频的增量归档，并一条命令跑完规格探测、感知哈希去重、缩略图、本地语义标注、幂等改名、双格式登记表、三处落地、自验收与产能汇总。全程不调用任何外部 agent。"
  provenance:
    consumer: "trust and traceability"
    author: "Linze"
    origin: "LinzeColin/KMOS · KMVideo/skills/dingtalk-incremental-media-archive"
    canonical_source: "KMOS repo, branch codex/kmvideo-pipeline-v020 (merged to main)"
    input_mode: "DWS 官方 CLI 只读拉取；SMB 原件写入；不读浏览器 Cookie/钥匙串/钉钉本地库"
    public_repo_safe: false
    public_repo_note: "原始素材绝不入公开仓；仅脱敏登记表、缩略图清单与本 Skill 源码可公开。"
  capability_contract:
    consumer: "Codex/LLM activation"
    trigger: "钉钉群素材归档、KMVideo 素材登记、素材改名打标签、缩略图与去重、产能汇总"
    entrypoint: "scripts/kmvideo_pipeline.py"
    stages: "scan, probe, thumbs, dedup, label, rename, registry, upload, accept, report"
    persistent_output: "smb://192.168.0.1/share/03_资料库/MetaData/IDS_MetaData/KMVideo/素材登记表.csv"
    stable_memory_write: false
  runtime_requirements:
    consumer: "installation"
    must_run_inside_kmos_checkout: true
    reason: "archive_internal_media.py 用 Path(__file__).parents[4] 反推 KMOS 根以定位 KMDatabase/machine/tools/private_db_client.py。装到 ~/.codex/skills/ 后该路径解析为家目录，Private-Database 上传会静默跳过。"
    external_tools: "dws CLI, ffmpeg, ffprobe, rsync, gh (可选，用于 Release 资产)"
    forbidden: "不得调用任何外部 agent（Claude Code CLI / Codex CLI / 远程视觉服务）"
  verification:
    consumer: "skill_log_evals"
    validator: "scripts/kmvideo_pipeline.py accept"
    acceptance: "登记表非空、无重复行、新文件名格式合规、描述 2-6 字、枚举字段使用原始词汇、画质等级与分辨率一致、.manifest.jsonl 未被修改、改名幂等"
    known_gaps: "label 阶段依赖钉钉消息上下文关键词映射，准确率未做规模验证；脱敏预判为关键词匹配，无 OCR 与人脸检测，可能漏判画面内客户名称与人员。"
  controlled_iteration:
    consumer: "skill_controlled_iterate"
    change_policy: "一轮只改一个阶段；改动后必须重跑 accept 并与既有登记表逐行比对"
