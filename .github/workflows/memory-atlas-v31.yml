name: Memory Atlas P0 recovery acceptance

on:
  push:
    branches: [main]
    paths:
      - "MemoryAtlas/**"
      - "OpenAIDatabase/scripts/memory_atlas_private/**"
      - "OpenAIDatabase/scripts/memory_atlas_source_capture_entry.py"
      - "OpenAIDatabase/tests/test_memory_atlas_private_v31.py"
      - "ops/memory-atlas/**"
      - ".github/workflows/memory-atlas-v31.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-atlas-p0-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MemoryAtlas/package-lock.json
      - name: Install locked production and deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement OpenAIDatabase/scripts/memory_atlas_private/requirements-memory-atlas-private.txt
          python -m pip install --disable-pip-version-check 'jsonschema>=4.25.1,<5' 'referencing>=0.36.2,<1'
          python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Python syntax and Memory Atlas private spine tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q OpenAIDatabase/scripts/memory_atlas_private OpenAIDatabase/scripts/memory_atlas_source_capture_entry.py
          pytest -q OpenAIDatabase/tests/test_memory_atlas_private_v31.py
      - name: Shell syntax
        run: |
          find ops/memory-atlas -type f \( -name '*.sh' -o -name 'memory-atlas-selfheal' \) -print0 | xargs -0 -n1 bash -n
      - name: Install frontend dependencies
        working-directory: MemoryAtlas
        run: npm ci
      - name: Existing Memory Atlas regression suite
        working-directory: MemoryAtlas
        run: |
          npm run lint
          npm run validate:preservation
          npm run build
          npm run validate:whole-project
      - name: Fail closed on unresolved merge or placeholder markers
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path('MemoryAtlas/src/v31'),Path('OpenAIDatabase/scripts/memory_atlas_private'),Path('ops/memory-atlas')]
          merge_tokens=('<<<<<<<','=======','>>>>>>>')
          placeholder_tokens=('T'+'ODO','T'+'BD','FIX'+'ME')
          bad=[]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file(): continue
                  text=path.read_text(encoding='utf-8',errors='ignore')
                  if any(token in text for token in merge_tokens + placeholder_tokens): bad.append(str(path))
          if bad: raise SystemExit('unresolved markers: '+', '.join(bad))
          PY
