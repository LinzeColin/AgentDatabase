name: Memory Atlas P0 recovery acceptance

on:
  push:
    branches: [main]
    paths:
      - "MemoryAtlas/**"
      - "OpenAIDatabase/scripts/memory_atlas_private/**"
      - "OpenAIDatabase/scripts/memory_atlas_source_capture_entry.py"
      - "OpenAIDatabase/tests/test_memory_atlas_private_v31.py"
      - "ops/memory-atlas/**"
      - ".github/workflows/memory-atlas-v31.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-atlas-p0-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # compileall and pytest both write bytecode caches into the tree they
      # touch, which the fail-closed step below rejects. Redirect every cache
      # out of the working tree so the syntax check stays real and the
      # no-cache-in-source rule stays enforceable.
      PYTHONPYCACHEPREFIX: /tmp/memory-atlas-pycache
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MemoryAtlas/package-lock.json
      - name: Install locked production and deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement OpenAIDatabase/scripts/memory_atlas_private/requirements-memory-atlas-private.txt
          python -m pip install --disable-pip-version-check 'jsonschema>=4.25.1,<5' 'referencing>=0.36.2,<1'
          python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Install pinned age toolchain
        env:
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
          AGE_VERSION: 1.3.1
        run: |
          archive="$RUNNER_TEMP/age.tar.gz"
          install_dir="$RUNNER_TEMP/age-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$AGE_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          mkdir --parents "$install_dir"
          install --mode 0755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" "$install_dir/"
          "$install_dir/age" --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Python syntax and Memory Atlas private spine tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q OpenAIDatabase/scripts/memory_atlas_private OpenAIDatabase/scripts/memory_atlas_acceptance OpenAIDatabase/scripts/memory_atlas_source_capture_entry.py ops/memory-atlas
          pytest -q OpenAIDatabase/tests/test_memory_atlas_private_v31.py OpenAIDatabase/tests/test_memory_atlas_source_runner_v31.py OpenAIDatabase/tests/test_memory_atlas_live_snapshot_api_v32.py OpenAIDatabase/tests/test_memory_atlas_live_snapshot_publish_v32.py
          python -m unittest discover -s OpenAIDatabase/scripts/memory_atlas_acceptance -t OpenAIDatabase/scripts/memory_atlas_acceptance
      - name: Privacy exposure and zero-model dependency scan
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python OpenAIDatabase/scripts/memory_atlas_acceptance/privacy_and_dependency_scan.py \
            --snapshot OpenAIDatabase/fixtures/live_snapshot.synthetic.json \
            --snapshot OpenAIDatabase/fixtures/private_analytics.synthetic.json \
            --snapshot OpenAIDatabase/fixtures/visual_analytics.synthetic.json \
            --output "$RUNNER_TEMP/privacy-dependency-scan.json"
      - name: Shell syntax
        run: |
          find ops/memory-atlas -type f \( -name '*.sh' -o -name 'memory-atlas-selfheal' \) -print0 | xargs -0 -n1 bash -n
      - name: Install frontend dependencies
        working-directory: MemoryAtlas
        run: npm ci
      - name: Existing Memory Atlas regression suite
        working-directory: MemoryAtlas
        run: |
          npm run lint
          npm run validate:preservation
          npm run validate:v31
          npm run validate:v31:incremental
          npm run validate:v31:typescript
          npm run build
          npm run validate:whole-project
      - name: Thirteen-route browser acceptance with A/B/C and light/dark
        working-directory: MemoryAtlas
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/memory-atlas-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          MEMORY_ATLAS_BASE_URL=http://127.0.0.1:4173 npm run validate:v31:browser
          # Rollback path: with the live-snapshot flag off the panel must vanish
          # and the original ten views must still render. This preview has no
          # private API, so it is exactly the flag-off shape being asserted.
          npm run validate:v32:rollback -- http://127.0.0.1:4173/ "$RUNNER_TEMP/rollback-runtime.json" runtime
      - name: Fail closed on markers, caches, parallel shells and credential material
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('MemoryAtlas/src/v31'),Path('MemoryAtlas/src/features/v31'),Path('OpenAIDatabase/scripts/memory_atlas_private'),Path('ops/memory-atlas')]
          merge_tokens=('<'*7,'='*7,'>'*7)
          placeholder_tokens=('T'+'ODO','T'+'BD','FIX'+'ME')
          secret=[re.compile(r'ghp_[A-Za-z0-9]{20,}'),re.compile(r'BEGIN [A-Z ]*PRIVATE KEY'),re.compile(r'password\s*=\s*[^\s"\']+',re.I)]
          bad=[]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file(): continue
                  if '__pycache__' in path.parts or path.suffix=='.pyc': bad.append(f'{path}:cache'); continue
                  text=path.read_text(encoding='utf-8',errors='ignore')
                  if any(token in text for token in merge_tokens + placeholder_tokens): bad.append(f'{path}:marker')
                  if any(pattern.search(text) for pattern in secret): bad.append(f'{path}:secret')
          app=Path('MemoryAtlas/src/App.tsx').read_text(encoding='utf-8')
          if re.search(r'V31App|legacy\s*=|ma31-legacy-boundary|ma31-root',app): bad.append('MemoryAtlas/src/App.tsx:parallel-shell')
          if bad: raise SystemExit('acceptance violations: '+', '.join(sorted(set(bad))))
          PY
